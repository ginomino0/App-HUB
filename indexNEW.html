<head>

<title>App Hub – Le Mie Utility Web</title>

<style>
:root{--bg:#d9dee4;--side:#6f4f53;--tx:#1f2933;--dk:#1d1719;color-scheme:light}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.6 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #f0d9a8;outline-offset:2px}
header{background:#353a40;color:#fff;padding:30px 24px 26px;text-align:center;position:relative}
.brand h1{font-size:clamp(2.4rem,7vw,4.4rem);font-weight:800;letter-spacing:.06em;line-height:1}
.brand p{color:#c4cbd3;font-size:1rem;margin-top:10px}
.lang{position:absolute;top:14px;right:18px;display:flex;border:1px solid #636b74;border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;color:#c4cbd3;padding:6px 12px;cursor:pointer;font-size:.85rem}
.lang button.on{background:#e8ecef;color:#353a40;font-weight:700}
.menu-btn{display:none;position:absolute;top:14px;left:18px;background:none;border:1px solid #636b74;color:#fff;border-radius:8px;padding:6px 14px;cursor:pointer}
.layout{display:grid;grid-template-columns:minmax(280px,30%) 1fr;align-items:start}
aside{background:var(--side);position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px 40px}
.search{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:2px 12px;margin-bottom:16px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font:inherit;padding:10px 0;color:#fff}
.search input::placeholder{color:rgba(255,255,255,.72)}
.grp{margin-bottom:8px}
.gh{width:100%;display:flex;align-items:center;gap:10px;background:var(--c);color:var(--dk);border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:800;text-align:left}
.gh:hover{filter:brightness(1.06)}
.gh .cnt{margin-left:auto;font-weight:700;font-size:.85rem;opacity:.75}
.gh .chev{width:8px;height:8px;border-right:2px solid var(--dk);border-bottom:2px solid var(--dk);transform:rotate(45deg);transition:transform .15s;margin:0 2px 3px 6px}
.grp.shut .chev{transform:rotate(-45deg);margin-bottom:0}
.grp.shut ul{display:none}
.grp ul{list-style:none;padding:5px 0 4px}
.it{display:flex;gap:10px;align-items:center;padding:7px 10px;margin:1px 0;border-radius:6px;color:#f6ece9;font-size:.95rem;border-left:4px solid var(--c)}
.it:hover{background:rgba(255,255,255,.12)}
.it.sel{background:var(--c);color:var(--dk);font-weight:800}
.it span:first-child{width:22px;text-align:center}
main{padding:32px clamp(18px,4vw,48px) 60px;min-width:0}
article{max-width:880px}
.crumb{display:inline-block;background:var(--c);color:var(--dk);font-weight:700;font-size:.88rem;border-radius:999px;padding:3px 14px;margin-bottom:14px}
.stage{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 38%,#c9cfd6),color-mix(in srgb,var(--c) 62%,#c9cfd6));display:grid;place-items:center;border:1px solid #b7bec6}
.stage .ph{text-align:center;color:color-mix(in srgb,var(--c) 25%,#1d1719)}
.stage .ph b{display:block;font-size:4.5rem;line-height:1.1}
.stage .ph span{font-weight:700;font-size:1.2rem}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;cursor:zoom-in}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.thumbs img{height:72px;border-radius:8px;border:3px solid #b7bec6;cursor:pointer;background:#fff}
.thumbs img.on{border-color:var(--c)}
.head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-top:26px}
.head h2{font-size:1.9rem;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.go{background:#353a40;color:#fff;font-weight:700;border-radius:10px;padding:12px 26px;white-space:nowrap}
.go:hover{background:#1f2429}
.st{display:inline-block;font-size:.82rem;border-radius:999px;padding:2px 12px;margin-top:6px;background:color-mix(in srgb,var(--s) 22%,#fff);color:color-mix(in srgb,var(--s) 65%,#1f2933);font-weight:700}
.desc{margin-top:18px;font-size:1.08rem;line-height:1.75;color:#2b333b;max-width:66ch}
.none{color:#f1e3df;padding:10px 8px}
.big{position:fixed;inset:0;z-index:60;background:rgba(20,26,32,.9);display:none;place-items:center;padding:16px;cursor:zoom-out}
.big.open{display:grid}.big img{max-width:100%;max-height:100%;border-radius:8px}
.veil{display:none}
@media(max-width:820px){
 header{padding:56px 18px 22px}.menu-btn{display:block}
 .layout{display:block}
 aside{position:fixed;z-index:40;left:0;top:0;width:86%;max-width:340px;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.3)}
 aside.open{transform:none}
 .veil.open{display:block;position:fixed;inset:0;z-index:30;background:rgba(20,26,32,.5)}
 main{padding-top:20px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function nav(){

    const list=APPS.filter(a=>a.cat===k&&(!q||norm(a.n+" "+a.it+" "+a.en).includes(q)));

    html+=`<section class="grp${closed?" shut":""}" style="--c:${CATS[k].c}"><button class="gh" data-k="${k}"><span>${CATS[k][L]}</span><span class="cnt">${list.length}</span><span class="chev"></span></button><ul>${list.map(a=>`<li><a class="it${a.id===SEL?" sel":""}" href="#${a.id}" data-id="${a.id}"><span>${a.ic}</span><span>${a.n}</span></a></li>`).join("")}</ul></section>`;
  }
  $("nav").innerHTML=html||`<p class="none">${TX[L].none}</p>`;
}
async function show(){
  const a=APPS.find(x=>x.id===SEL),t=TX[L],c=CATS[a.cat],my=++tok;
  $("main").innerHTML=`<article style="--c:${c.c}"><div class="crumb">${c[L]}</div>
  <div class="stage" id="stage"><div class="ph"><b>${a.ic}</b><span>${a.n}</span></div></div><div class="thumbs" id="th"></div>
  <div class="head"><div style="flex:1;min-width:200px"><h2>${a.n}</h2><span class="st" style="--s:${ST[a.st].c}">${ST[a.st][L]}</span></div><a class="go" href="${a.u}">${t.open}</a></div>
  <p class="desc">${(L==="it"&&DESC[a.id])||a[L]}</p></article>`;
  const urls=[a.id+".png",a.id+"-1.png",a.id+"-2.png",a.id+"-3.png"].map(f=>"screenshots/"+f);
  const ok=(await Promise.all(urls.map(u=>new Promise(r=>{const i=new Image();i.onload=()=>r(u);i.onerror=()=>r(null);i.src=u})))).filter(Boolean);
  if(my!==tok||!ok.length)return;
  const im=document.createElement("img");im.src=ok[0];im.alt=a.n;im.onclick=()=>{$("big").firstChild.src=im.src;$("big").classList.add("open")};
  $("stage").appendChild(im);
  if(ok.length>1)ok.forEach((u,i)=>{const th=new Image();th.src=u;th.alt="";if(!i)th.className="on";
    th.onclick=()=>{im.src=u;[...$("th").children].forEach(x=>x.classList.remove("on"));th.classList.add("on")};$("th").appendChild(th)});
}
function ui(){
  const t=TX[L];document.documentElement.lang=L;
  $("sub").textContent=t.sub;$("q").placeholder=t.ph;$("mb").textContent=t.menu;
  $("l-it").classList.toggle("on",L==="it");$("l-en").classList.toggle("on",L==="en");
  nav();show();
}
const drawer=o=>{$("side").classList.toggle("open",o);$("veil").classList.toggle("open",o)};
$("nav").onclick=e=>{
  const g=e.target.closest(".gh");
  if(g){const k=g.dataset.k;shut.has(k)?shut.delete(k):shut.add(k);nav();return}
  const a=e.target.closest(".it");
  if(a){e.preventDefault();SEL=a.dataset.id;history.replaceState(null,"","#"+SEL);nav();show();drawer(false);scrollTo(0,0)}
};
$("q").oninput=e=>{Q=e.target.value;nav()};
$("mb").onclick=()=>drawer(true);$("veil").onclick=()=>drawer(false);
$("big").onclick=()=>$("big").classList.remove("open");
document.onkeydown=e=>{if(e.key==="Escape"){$("big").classList.remove("open");drawer(false)}};
["it","en"].forEach(l=>$("l-"+l).onclick=()=>{L=l;localStorage.setItem("hubLang",l);ui()});
ui();
</script>
</body>
</html>
