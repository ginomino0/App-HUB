<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tris Evoluto - Timer, Simboli e Coriandoli</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-x: #38bdf8;
            --accent-o: #f43f5e;
            --grid-line: #334155;
            --cell-hover: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: auto;
            padding: 10px;
        }

        .container {
            text-align: center;
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 440px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        h1 {
            margin-top: 0;
            font-size: 1.4rem;
            margin-bottom: 0.2rem;
        }

        .subtitle {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 0.8rem;
            min-height: 1rem;
        }

        .selectors-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 0.8rem;
        }

        .selector-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            align-items: center;
        }

        .mode-btn {
            background-color: #334155;
            color: #94a3b8;
            border: none;
            padding: 0.35rem 0.6rem;
            font-size: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
        }

        .mode-btn.active {
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
        }

        .mode-btn.toggle-off {
            background-color: #475569;
            color: #cbd5e1;
        }

        .mode-btn.toggle-on {
            background-color: #10b981;
            color: #fff;
            font-weight: bold;
        }

        select.mode-btn {
            background-color: #334155;
            color: #f8fafc;
            text-align: center;
            font-family: inherit;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .status {
            flex: 1;
            text-align: left;
        }

        .timer-display {
            background: #0f172a;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            color: #fbbf24;
            font-size: 0.85rem;
            display: none;
        }

        .board {
            display: grid;
            gap: 8px;
            margin-bottom: 1rem;
        }

        .grid-3x3 { grid-template-columns: repeat(3, 1fr); }
        .grid-5x5 { grid-template-columns: repeat(5, 1fr); }

        .cell {
            aspect-ratio: 1;
            background-color: #0f172a;
            border: 2px solid var(--grid-line);
            border-radius: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
            user-select: none;
            position: relative;
        }

        .grid-3x3 .cell { font-size: 2rem; }
        .grid-5x5 .cell { font-size: 1.2rem; }

        .cell:hover:not(.taken) {
            background-color: var(--cell-hover);
            border-color: #64748b;
        }

        .cell.p1 { color: var(--accent-x); } 
        .cell.p2 { color: var(--accent-o); }

        @keyframes popIn {
            0% { transform: scale(0.4); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .cell.taken {
            animation: popIn 0.25s ease-out forwards;
        }

        @keyframes pulseFade {
            0% { opacity: 0.9; transform: scale(1); box-shadow: inset 0 0 0px rgba(244, 63, 94, 0); }
            50% { opacity: 0.35; transform: scale(0.92); box-shadow: inset 0 0 12px currentColor; }
            100% { opacity: 0.9; transform: scale(1); box-shadow: inset 0 0 0px rgba(244, 63, 94, 0); }
        }

        .cell.fade-out {
            border-style: dashed;
            border-color: #cbd5e1;
            animation: pulseFade 1.2s infinite ease-in-out;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            background-color: #475569;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: bold;
            width: 100%;
        }

        .btn:hover { background-color: #64748b; }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 0.8rem;
            font-size: 0.85rem;
            background: #0f172a;
            padding: 0.4rem;
            border-radius: 8px;
        }

        .score-p1 { color: var(--accent-x); }
        .score-p2 { color: var(--accent-o); }

        /* Stile Coriandoli */
        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            top: 0;
            pointer-events: none;
            z-index: 10;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(400px) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="gameContainer">
        <h1>Tris Evoluto</h1>
        <div class="subtitle" id="subtitle">Configura la partita e inizia a giocare!</div>

        <div class="selectors-group">
            <div class="selector-row">
                <button class="mode-btn active" id="grid3">Griglia 3x3</button>
                <button class="mode-btn" id="grid5">Griglia 5x5</button>
            </div>
            <div class="selector-row">
                <button class="mode-btn active" id="modeVorticoso">Vorticoso</button>
                <button class="mode-btn" id="modeClassico">Classico</button>
            </div>
            <div class="selector-row">
                <button class="mode-btn active" id="modePvp">2 Giocatori</button>
                <button class="mode-btn" id="modeCpu">vs CPU</button>
            </div>
            <div class="selector-row" id="difficultyRow" style="display: none;">
                <button class="mode-btn active" id="diffNormale">Normale</button>
                <button class="mode-btn" id="diffAvanzato">Avanzato</button>
                <button class="mode-btn" id="diffExtreme">Extreme</button>
            </div>
            <div class="selector-row">
                <select class="mode-btn" id="symbolSelect">
                    <option value="classic">Simboli: ❌ / ⭕</option>
                    <option value="animals">Simboli: 🐱 / 🐶</option>
                    <option value="fruit">Simboli: 🍎 / 🍌</option>
                    <option value="elements">Simboli: 🔥 / 💧</option>
                    <option value="space">Simboli: ⭐ / 🌙</option>
                </select>
                <button class="mode-btn toggle-off" id="timerToggleBtn">Timer 5s: OFF</button>
            </div>
        </div>

        <div class="scoreboard">
            <div>Giocatore 1: <span id="scoreP1" class="score-p1">0</span></div>
            <div id="labelScoreP2">Giocatore 2: <span id="scoreP2" class="score-p2">0</span></div>
        </div>

        <div class="status-bar">
            <div class="status" id="status">Turno: P1</div>
            <div class="timer-display" id="timerDisplay">⏱ <span id="timeLeft">5</span>s</div>
        </div>

        <div class="board grid-3x3" id="board"></div>

        <div class="controls">
            <button class="btn" id="resetBtn">Riavvia Partita</button>
        </div>
    </div>

    <script>
        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');
        const subtitleElement = document.getElementById('subtitle');
        const resetBtn = document.getElementById('resetBtn');
        const scoreP1El = document.getElementById('scoreP1');
        const labelScoreP2 = document.getElementById('labelScoreP2');
        const containerEl = document.getElementById('gameContainer');
        
        const grid3Btn = document.getElementById('grid3');
        const grid5Btn = document.getElementById('grid5');
        const modeVorticosoBtn = document.getElementById('modeVorticoso');
        const modeClassicoBtn = document.getElementById('modeClassico');
        const modePvpBtn = document.getElementById('modePvp');
        const modeCpuBtn = document.getElementById('modeCpu');
        
        const difficultyRow = document.getElementById('difficultyRow');
        const diffNormaleBtn = document.getElementById('diffNormale');
        const diffAvanzatoBtn = document.getElementById('diffAvanzato');
        const diffExtremeBtn = document.getElementById('diffExtreme');
        
        const symbolSelect = document.getElementById('symbolSelect');
        const timerToggleBtn = document.getElementById('timerToggleBtn');
        const timerDisplay = document.getElementById('timerDisplay');
        const timeLeftSpan = document.getElementById('timeLeft');

        let size = 3;
        let board = Array(9).fill(null);
        let currentPlayer = 'X'; // 'X' o 'O' internamente per la logica
        let isGameActive = true;
        
        let gameMode = 'vorticoso'; 
        let vsCpu = false;
        let cpuDifficulty = 'normale';
        let timerEnabled = false;
        let turnInterval = null;
        let timeLeft = 5;
        
        let currentSymbols = { 'X': '❌', 'O': '⭕' };
        let movesQueue = { 'X': [], 'O': [] };
        let scores = { 'X': 0, 'O': 0 };

        const symbolThemes = {
            classic: { 'X': '❌', 'O': '⭕' },
            animals: { 'X': '🐱', 'O': '🐶' },
            fruit: { 'X': '🍎', 'O': '🍌' },
            elements: { 'X': '🔥', 'O': '💧' },
            space: { 'X': '⭐', 'O': '🌙' }
        };

        // Audio Context per i suoni nativi
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            try {
                initAudio();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'move') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'fade') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(110, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'win') {
                    const notes = [330, 392, 659];
                    notes.forEach((freq, i) => {
                        let t = now + i * 0.12;
                        let o = audioCtx.createOscillator();
                        let g = audioCtx.createGain();
                        o.type = 'triangle';
                        o.frequency.setValueAtTime(freq, t);
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        g.gain.setValueAtTime(0.2, t);
                        g.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
                        o.start(t);
                        o.stop(t + 0.2);
                    });
                } else if (type === 'lose') {
                    const notes = [300, 250, 180];
                    notes.forEach((freq, i) => {
                        let t = now + i * 0.15;
                        let o = audioCtx.createOscillator();
                        let g = audioCtx.createGain();
                        o.type = 'sawtooth';
                        o.frequency.setValueAtTime(freq, t);
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        g.gain.setValueAtTime(0.2, t);
                        g.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
                        o.start(t);
                        o.stop(t + 0.2);
                    });
                } else if (type === 'tie') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(250, now);
                    osc.frequency.linearRampToValueAtTime(200, now + 0.3);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch(e) {
                console.log("Audio non disponibile", e);
            }
        }

        // Effetto Coriandoli
        function triggerConfetti() {
            for (let i = 0; i < 40; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * containerEl.clientWidth + 'px';
                conf.style.backgroundColor = ['#38bdf8', '#f43f5e', '#fbbf24', '#34d399', '#a78bfa'][Math.floor(Math.random() * 5)];
                conf.style.animationDuration = (Math.random() * 0.8 + 0.8) + 's';
                conf.style.animationDelay = Math.random() * 0.3 + 's';
                containerEl.appendChild(conf);
                setTimeout(() => conf.remove(), 1500);
            }
        }

        // Gestione Eventi Menu
        grid3Btn.addEventListener('click', () => setGridSize(3));
        grid5Btn.addEventListener('click', () => setGridSize(5));
        modeVorticosoBtn.addEventListener('click', () => setGameMode('vorticoso'));
        modeClassicoBtn.addEventListener('click', () => setGameMode('classico'));
        modePvpBtn.addEventListener('click', () => setCpuMode(false));
        modeCpuBtn.addEventListener('click', () => setCpuMode(true));

        diffNormaleBtn.addEventListener('click', () => setDifficulty('normale'));
        diffAvanzatoBtn.addEventListener('click', () => setDifficulty('avanzato'));
        diffExtremeBtn.addEventListener('click', () => setDifficulty('extreme'));

        symbolSelect.addEventListener('change', (e) => {
            currentSymbols = symbolThemes[e.target.value];
            render();
        });

        timerToggleBtn.addEventListener('click', () => {
            timerEnabled = !timerEnabled;
            timerToggleBtn.classList.toggle('toggle-on', timerEnabled);
            timerToggleBtn.classList.toggle('toggle-off', !timerEnabled);
            timerToggleBtn.textContent = `Timer 5s: ${timerEnabled ? 'ON' : 'OFF'}`;
            timerDisplay.style.display = timerEnabled ? 'block' : 'none';
            resetGame();
        });

        function setGridSize(s) {
            size = s;
            grid3Btn.classList.toggle('active', size === 3);
            grid5Btn.classList.toggle('active', size === 5);
            boardElement.className = `board grid-${size}x${size}`;
            resetGame();
        }

        function setGameMode(mode) {
            gameMode = mode;
            modeVorticosoBtn.classList.toggle('active', gameMode === 'vorticoso');
            modeClassicoBtn.classList.toggle('active', gameMode === 'classico');
            updateSubtitle();
            resetGame();
        }

        function setCpuMode(cpuMode) {
            vsCpu = cpuMode;
            modePvpBtn.classList.toggle('active', !vsCpu);
            modeCpuBtn.classList.toggle('active', vsCpu);
            difficultyRow.style.display = vsCpu ? 'flex' : 'none';
            labelScoreP2.innerHTML = `<span>${vsCpu ? 'CPU' : 'Giocatore 2'}: <span id="scoreP2" class="score-p2">${scores['O']}</span></span>`;
            resetGame();
        }

        function setDifficulty(diff) {
            cpuDifficulty = diff;
            diffNormaleBtn.classList.toggle('active', diff === 'normale');
            diffAvanzatoBtn.classList.toggle('active', diff === 'avanzato');
            diffExtremeBtn.classList.toggle('active', diff === 'extreme');
            resetGame();
        }

        function updateSubtitle() {
            if (gameMode === 'vorticoso') {
                const limit = size === 3 ? 3 : 5;
                subtitleElement.textContent = `Vorticoso: Max ${limit} pedine. La successiva fa sparire la prima!`;
            } else {
                const winLen = size === 3 ? 3 : 4;
                subtitleElement.textContent = `Classico: Allinea ${winLen} simboli per vincere.`;
            }
        }

        // Gestione Timer Turno
        function startTimer() {
            if (!timerEnabled || !isGameActive) return;
            clearInterval(turnInterval);
            timeLeft = 5;
            timeLeftSpan.textContent = timeLeft;
            timerDisplay.style.display = 'block';

            turnInterval = setInterval(() => {
                timeLeft--;
                timeLeftSpan.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(turnInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(turnInterval);
            timerDisplay.style.display = timerEnabled ? 'block' : 'none';
        }

        function handleTimeout() {
            if (!isGameActive) return;
            // Se scade il tempo, mossa casuale automatica per il giocatore corrente
            const emptyCells = board.map((val, idx) => val === null ? idx : null).filter(val => val !== null);
            if (emptyCells.length > 0) {
                const randomMove = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                makeMove(randomMove);
            }
        }

        function handleCellClick(e) {
            if (!isGameActive) return;
            if (vsCpu && currentPlayer === 'O') return;

            const cell = e.target.closest('.cell');
            if (!cell) return;
            const index = parseInt(cell.getAttribute('data-index'));

            if (board[index] !== null) return;

            makeMove(index);

            if (isGameActive && vsCpu && currentPlayer === 'O') {
                statusElement.textContent = "La CPU sta pensando...";
                stopTimer();
                setTimeout(cpuMove, 400);
            }
        }

        function makeMove(index) {
            stopTimer();
            const limit = size === 3 ? 3 : 5;
            
            if (gameMode === 'vorticoso' && movesQueue[currentPlayer].length === limit) {
                const oldestIndex = movesQueue[currentPlayer].shift();
                board[oldestIndex] = null;
                playSound('fade');
            } else {
                playSound('move');
            }

            board[index] = currentPlayer;
            if (gameMode === 'vorticoso') {
                movesQueue[currentPlayer].push(index);
            }

            render();

            if (checkWinOnBoard(board, currentPlayer)) {
                const isCpuWinner = vsCpu && currentPlayer === 'O';
                const winnerName = isCpuWinner ? 'la CPU' : (currentPlayer === 'X' ? 'Giocatore 1' : (vsCpu ? 'CPU' : 'Giocatore 2'));
                statusElement.innerHTML = `Vince <span class="${currentPlayer === 'X' ? 'score-p1' : 'score-p2'}">${winnerName}</span>!`;
                scores[currentPlayer]++;
                updateScoreboard();
                isGameActive = false;
                
                triggerConfetti();
                if (vsCpu) {
                    if (currentPlayer === 'O') playSound('lose');
                    else playSound('win');
                } else {
                    playSound('win');
                }
                return;
            }

            if (board.every(cell => cell !== null)) {
                statusElement.textContent = "Pareggio!";
                isGameActive = false;
                playSound('tie');
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateStatus();
            updateVisualQueue();
            startTimer();
        }

        function cpuMove() {
            if (!isGameActive) return;
            const emptyCells = board.map((val, idx) => val === null ? idx : null).filter(val => val !== null);
            if (emptyCells.length === 0) return;

            let bestMove = -1;

            if (cpuDifficulty === 'normale') {
                for (let idx of emptyCells) {
                    if (simulateWin(idx, 'O')) { bestMove = idx; break; }
                }
                if (bestMove === -1) {
                    for (let idx of emptyCells) {
                        if (simulateWin(idx, 'X')) { bestMove = idx; break; }
                    }
                }
                if (bestMove === -1) {
                    bestMove = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                }
            } 
            else if (cpuDifficulty === 'avanzato') {
                for (let idx of emptyCells) {
                    if (simulateWin(idx, 'O')) { bestMove = idx; break; }
                }
                if (bestMove === -1) {
                    for (let idx of emptyCells) {
                        if (simulateWin(idx, 'X')) { bestMove = idx; break; }
                    }
                }
                if (bestMove === -1 && size === 3 && board[4] === null) {
                    bestMove = 4;
                }
                if (bestMove === -1) {
                    bestMove = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                }
            }
            else if (cpuDifficulty === 'extreme') {
                for (let idx of emptyCells) {
                    if (simulateWin(idx, 'O')) { bestMove = idx; break; }
                }
                if (bestMove === -1) {
                    for (let idx of emptyCells) {
                        if (simulateWin(idx, 'X')) { bestMove = idx; break; }
                    }
                }
                if (bestMove === -1 && size === 3) {
                    let bestScore = -Infinity;
                    for (let idx of emptyCells) {
                        board[idx] = 'O';
                        let score = minimax(board, 0, false);
                        board[idx] = null;
                        if (score > bestScore) {
                            bestScore = score;
                            bestMove = idx;
                        }
                    }
                }
                if (bestMove === -1) {
                    bestMove = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                }
            }

            if (bestMove !== -1) {
                makeMove(bestMove);
            }
        }

        function minimax(newBoard, depth, isMaximizing) {
            if (checkWinOnBoard(newBoard, 'O')) return 10 - depth;
            if (checkWinOnBoard(newBoard, 'X')) return depth - 10;
            if (newBoard.every(cell => cell !== null) || depth > 5) return 0;

            const emptyCells = newBoard.map((val, idx) => val === null ? idx : null).filter(val => val !== null);

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let idx of emptyCells) {
                    newBoard[idx] = 'O';
                    let evaluation = minimax(newBoard, depth + 1, false);
                    newBoard[idx] = null;
                    maxEval = Math.max(maxEval, evaluation);
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let idx of emptyCells) {
                    newBoard[idx] = 'X';
                    let evaluation = minimax(newBoard, depth + 1, true);
                    newBoard[idx] = null;
                    minEval = Math.min(minEval, evaluation);
                }
                return minEval;
            }
        }

        function simulateWin(index, player) {
            let tempBoard = [...board];
            if (gameMode === 'vorticoso') {
                let tempQueue = [...movesQueue[player]];
                const limit = size === 3 ? 3 : 5;
                if (tempQueue.length === limit) {
                    tempBoard[tempQueue[0]] = null;
                }
            }
            tempBoard[index] = player;
            return checkWinOnBoard(tempBoard, player);
        }

        function checkWinOnBoard(b, player) {
            const winLen = (size === 3) ? 3 : 4;

            for (let r = 0; r < size; r++) {
                for (let c = 0; c <= size - winLen; c++) {
                    let winR = true;
                    for (let i = 0; i < winLen; i++) {
                        if (b[r * size + (c + i)] !== player) { winR = false; break; }
                    }
                    if (winR) return true;
                }
            }

            for (let c = 0; c < size; c++) {
                for (let r = 0; r <= size - winLen; r++) {
                    let winC = true;
                    for (let i = 0; i < winLen; i++) {
                        if (b[(r + i) * size + c] !== player) { winC = false; break; }
                    }
                    if (winC) return true;
                }
            }

            for (let r = 0; r <= size - winLen; r++) {
                for (let c = 0; c <= size - winLen; c++) {
                    let winD1 = true, winD2 = true;
                    for (let i = 0; i < winLen; i++) {
                        if (b[(r + i) * size + (c + i)] !== player) winD1 = false;
                        if (b[(r + i) * size + (c + winLen - 1 - i)] !== player) winD2 = false;
                    }
                    if (winD1 || winD2) return true;
                }
            }

            return false;
        }

        function render() {
            boardElement.innerHTML = '';
            board.forEach((val, i) => {
                const cell = document.createElement('div');
                cell.className = `cell ${val ? (val === 'X' ? 'p1' : 'p2') : ''}`;
                cell.setAttribute('data-index', i);
                if (val !== null) {
                    cell.textContent = currentSymbols[val];
                    cell.classList.add('taken');
                }
                boardElement.appendChild(cell);
            });
            updateVisualQueue();
        }

        function updateVisualQueue() {
            if (!isGameActive || gameMode !== 'vorticoso') return;
            const cells = document.querySelectorAll('.cell');
            cells.forEach(c => c.classList.remove('fade-out'));

            const limit = size === 3 ? 3 : 5;
            if (movesQueue[currentPlayer].length === limit) {
                const oldestIndex = movesQueue[currentPlayer][0];
                if (cells[oldestIndex]) {
                    cells[oldestIndex].classList.add('fade-out');
                }
            }
        }

        function updateStatus() {
            const pName = currentPlayer === 'X' ? 'Giocatore 1' : (vsCpu ? 'CPU' : 'Giocatore 2');
            const pClass = currentPlayer === 'X' ? 'score-p1' : 'score-p2';
            if (vsCpu && currentPlayer === 'O') {
                statusElement.innerHTML = `Turno della <span class="${pClass}">CPU</span>`;
            } else {
                statusElement.innerHTML = `Turno: <span class="${pClass}">${pName}</span>`;
            }
        }

        function updateScoreboard() {
            scoreP1El.textContent = scores['X'];
            document.getElementById('scoreP2').textContent = scores['O'];
        }

        function resetGame() {
            stopTimer();
            board = Array(size * size).fill(null);
            movesQueue = { 'X': [], 'O': [] };
            currentPlayer = Math.random() < 0.5 ? 'X' : 'O';
            isGameActive = true;
            updateSubtitle();
            updateStatus();
            render();
            startTimer();

            if (vsCpu && currentPlayer === 'O') {
                statusElement.textContent = "La CPU sta pensando...";
                setTimeout(cpuMove, 500);
            }
        }

        boardElement.addEventListener('click', handleCellClick);
        resetBtn.addEventListener('click', resetGame);

        resetGame();
    </script>
</body>
</html>
