<style>
:root{--bg:#d9dee4;--side:#6f4f53;--tx:#1f2933;--dk:#1d1719;--chrome:19rem;color-scheme:light}
html{font-size:clamp(16px,.55vw + 9px,21px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:1rem/1.6 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #f0d9a8;outline-offset:2px}
header{background:#353a40;color:#fff;padding:.7rem 1.25rem;text-align:center;position:relative}
.brand h1{font-size:clamp(1.7rem,4.2vw,2.6rem);font-weight:800;letter-spacing:.06em;line-height:1.05}
.brand p{color:#c4cbd3;font-size:clamp(.8rem,1.6vw,.95rem);margin-top:.2rem}
.lang{position:absolute;top:50%;right:clamp(10px,2vw,24px);transform:translateY(-50%);display:flex;border:1px solid #636b74;border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;color:#c4cbd3;padding:.35rem .75rem;cursor:pointer;font-size:.85rem}
.lang button.on{background:#e8ecef;color:#353a40;font-weight:700}
.bar{background:var(--side);padding:.65rem clamp(10px,2vw,24px);display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;position:relative;z-index:30}
.cat{position:relative;flex:1 1 8.5rem;max-width:15rem;min-width:0}
.cat.sr{flex:2 1 13rem;max-width:21rem}
.cb{width:100%;height:100%;min-height:2.75rem;background:var(--c);color:var(--dk);border:0;border-radius:8px;padding:.45rem .75rem;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.5rem;text-align:center;line-height:1.2}
.cb:hover{filter:brightness(1.06)}
.cat.cur .cb{box-shadow:inset 0 -5px 0 rgba(29,23,25,.45)}
.chev{width:.5rem;height:.5rem;border-right:2px solid var(--dk);border-bottom:2px solid var(--dk);transform:rotate(45deg);margin-bottom:.2rem;flex:none;transition:transform .15s}
.cat.open .chev{transform:rotate(-135deg);margin-bottom:-.1rem}
.search{display:flex;gap:.5rem;align-items:center;min-height:2.75rem;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:0 .75rem}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font:inherit;color:#fff;padding:.5rem 0}
.search input::placeholder{color:rgba(255,255,255,.75)}
.menu{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:40;background:#fff;border:1px solid #cdd3da;border-top:5px solid var(--c,#8a9099);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.28);padding:6px;list-style:none;min-width:100%;width:max-content;max-width:min(22rem,calc(100vw - 16px));max-height:min(60vh,26rem);overflow:auto}
.cat.open .menu{display:block}
.it{display:flex;align-items:center;gap:.65rem;padding:.55rem .75rem;min-height:2.75rem;border-radius:8px;color:var(--tx);border-left:4px solid var(--c);font-size:.95rem}
.it small{display:block;color:#66727f;font-size:.78rem;line-height:1.2}
.it:hover{background:color-mix(in srgb,var(--c) 24%,#fff)}
.it.sel{background:var(--c);font-weight:800;color:var(--dk)}
.it.sel small{color:rgba(29,23,25,.7)}
.it span:first-child{width:1.4rem;text-align:center;flex:none}
.none{padding:.7rem;color:#66727f}
main{padding:clamp(14px,2.4vw,32px) clamp(12px,4vw,96px) 48px}
article{display:grid;grid-template-columns:minmax(0,min(62%,max(18rem,calc((100vh - var(--chrome))*1.7778)))) minmax(0,1fr);gap:clamp(18px,2.4vw,40px);align-items:start}
.stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 38%,#c9cfd6),color-mix(in srgb,var(--c) 62%,#c9cfd6));display:grid;place-items:center;border:1px solid #b7bec6}
.stage .ph{text-align:center;color:color-mix(in srgb,var(--c) 25%,#1d1719);padding:1rem}
.stage .ph b{display:block;font-size:clamp(2.5rem,7vw,4.5rem);line-height:1.1}
.stage .ph span{font-weight:700;font-size:1.2rem}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;cursor:zoom-in}
.thumbs{display:flex;gap:.6rem;margin-top:.75rem;flex-wrap:wrap}
.thumbs img{height:clamp(48px,5.5vw,76px);border-radius:8px;border:3px solid #b7bec6;cursor:pointer;background:#fff;max-width:100%}
.thumbs img.on{border-color:var(--c)}
.info{max-width:50rem;background:rgba(255,255,255,.6);border:1px solid #c3cad2;border-radius:16px;padding:clamp(16px,2vw,28px);min-width:0}
.crumb{display:inline-block;background:var(--c);color:var(--dk);font-weight:700;font-size:.85rem;border-radius:999px;padding:.15rem .9rem;margin-bottom:.7rem}
.info h2{font-size:clamp(1.5rem,1.1rem + 1.3vw,2.4rem);font-weight:800;line-height:1.2;letter-spacing:-.01em;overflow-wrap:anywhere}
.st{display:inline-block;font-size:.82rem;border-radius:999px;padding:.1rem .75rem;margin-top:.4rem;background:color-mix(in srgb,var(--s) 22%,#fff);color:color-mix(in srgb,var(--s) 65%,#1f2933);font-weight:700}
.go{display:block;text-align:center;background:#353a40;color:#fff;font-weight:700;border-radius:10px;padding:.8rem 1.2rem;margin-top:1.1rem}
.go:hover{background:#1f2429}
.desc{margin-top:1.1rem;font-size:clamp(.95rem,.88rem + .28vw,1.12rem);line-height:1.68;color:#2b333b}
.big{position:fixed;inset:0;z-index:60;background:rgba(20,26,32,.9);display:none;place-items:center;padding:16px;cursor:zoom-out}
.big.open{display:grid}.big img{max-width:100%;max-height:100%;border-radius:8px}
@media(max-width:900px){article{grid-template-columns:minmax(0,1fr)}.stage{width:100%}}
@media(max-width:600px){.cat{flex-basis:6.5rem}.cat.sr{flex-basis:100%;max-width:none}.cb{font-size:.82rem;padding:.3rem .4rem;min-height:2.5rem}.search{min-height:2.5rem}.lang{position:static;transform:none;display:inline-flex;margin-top:.5rem}header{padding-bottom:.8rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

"tetris":"Versione di Tetris, la Nexus Edition, da giocare nel browser. Premi Start e comanda i blocchi che scendono: A e D li spostano a sinistra e a destra, W li ruota, S li fa scendere più in fretta e Spazio li lascia cadere di colpo, mentre P mette in pausa. Completando le righe fai punti e sali di livello, con l’anteprima del pezzo successivo sempre visibile. Su smartphone si usano i pulsanti a schermo.",

"photo-studio-web-pro":"Editor di fotoritocco a livelli che funziona nel browser. Apri o trascini una foto e puoi ridimensionarla, ritagliarla, ruotarla e ribaltarla, aggiungere cornici, vignettatura e una filigrana di testo. Puoi anche selezionare una parte dell’immagine ed estrarla come nuovo livello, da duplicare, spostare, nascondere o modificare con regolazioni ed effetti solo su quel livello. Annulla e Ripeti permettono di provare senza rischi, e «Reset Foto» torna all’originale.",

"yt-downloader":"Generatore di comandi per scaricare video e audio da Windows. Incolli il link, scegli il formato (video MP4 fino a 720p, MP4 alla massima qualità o solo audio MP3 a 192 kbps) e la cartella di salvataggio (Desktop, Download o un percorso personalizzato) e ottieni il comando pronto da copiare e incollare nel Prompt dei comandi. In basso trovi la guida alla prima installazione degli strumenti necessari (yt-dlp e FFmpeg), l’aggiornamento e le soluzioni agli errori più comuni.",
"iptv-stream-checker":"Incolli l’indirizzo di una lista M3U oppure il suo testo e premi «Estrapola e Testa Canali»: l’app ricava i canali e verifica uno per uno se rispondono, con un controllo avanzato pensato per superare le restrizioni di rete. Due contatori mostrano quanti canali funzionano e quanti no, così scarti i link morti prima di usare la lista nel tuo player.",
"text-transformer":"Scrivi o incolla un testo e lo vedi trasformarsi all’istante in decine di stili: al contrario, sottosopra, aLtErNaTo da meme, spaziato vaporwave, leet speak, barrato, grassetto e monospace con caratteri speciali, corsivo elegante, gotico, cerchietti, quadretti e altri decorati con simboli. Ogni risultato si copia con un clic, pronto da incollare nei social, nei messaggi o nei profili. «Cancella» svuota il campo.",
"semplifica-documenti":"Chiarofilo rende comprensibili i testi difficili. Incolli il testo (contratti, condizioni d’uso, referti, clausole tecniche) o carichi un file TXT o PDF, scegli il tipo di documento e ricevi una spiegazione in linguaggio semplice con ciò che conta davvero. Prima dell’invio puoi oscurare i nomi di persone ed enti, rilevati in automatico o aggiunti a mano, controllando l’anteprima di ciò che verrà inviato a Gemini. Puoi poi fare domande sul documento e salvare il risultato in TXT o PDF. Serve una chiave API Gemini gratuita, conservata solo nel tuo browser.",
"sticky-notes":"Bacheca di post-it digitali. Con «+ Nuovo Post-it» aggiungi una nota, la scrivi e la tieni a portata di mano sulla pagina; con «Elimina Tutti» ripulisci la bacheca. Le note sono salvate nel browser: le ritrovi alla riapertura, ma solo sullo stesso dispositivo e con lo stesso browser.",
"splitter-txt":"Suddivide file HTML, TXT o di codice in più parti da un numero massimo di righe, senza spezzare righe a metà né tagliare le parole. Trascini il file (o lo cerchi con Sfoglia), imposti il massimo di righe per file e premi «Suddividi e Scarica». Compare l’elenco dei file generati, da scaricare uno per uno oppure tutti insieme. Utile per dividere testi o codici troppo lunghi da incollare in strumenti con limiti di lunghezza.",
"txt-to-pdf":"Impaginatore di documenti. Dai un titolo al documento, importi un file TXT oppure incolli o scrivi il testo e scarichi un PDF già impaginato con «Scarica PDF Impaginato». Comodo per trasformare appunti o testi semplici in un documento ordinato, pronto da inviare o stampare.",
"ortofoto-composer":"Crea un’unica mappa ad alta risoluzione di un’area scelta, richiedendo direttamente al servizio geografico i ritagli necessari. Scegli il servizio (ortofoto storiche della Lombardia dal 1954 al 2021, immagini satellitari ESRI o mappa stradale OpenStreetMap), inserisci le coordinate del centro e larghezza e altezza dell’area in chilometri, poi imposti risoluzione, zoom e, per le ortofoto storiche, l’anno. Con «Genera mappa» la componi, la esplori con zoom e adattamento e la scarichi in PNG.",
"atlante-vivo":"Mappa interattiva con vista stradale e satellitare. Cerchi una città, una frazione, una chiesa, un monumento o una montagna e generi con l’AI una scheda con panoramica, dati e statistiche, storia, cultura e dialetto e detti, volendo con dettagli extra da Wikipedia. Puoi confrontare due luoghi, sfogliare le foto di un luogo, rivedere cronologia di ricerche e approfondimenti e scaricare quelli selezionati in PDF. Serve una chiave API Gemini gratuita, da configurare una sola volta.",
"investigatore-storico":"Inserisci una località, con eventuale provincia o stato, e premi Cerca: l’app interroga più fonti, tra cui Google Books, Open Library, Wikisource, Wikipedia, Project Gutenberg e Internet Archive (con ricerca anche dentro il testo dei libri), e mostra i libri trovati. Con «Genera Minilibro» Gemini riassume il materiale in un minilibro sulla località, che puoi copiare o scaricare in TXT o PDF, anche parziale. Servono le chiavi API richieste, conservate solo nel tuo browser.",
"rinomina-file":"Rinomina in sequenza le tue immagini. Selezioni le immagini, imposti il nome di base e il numero da cui partire e con «Rinomina e Scarica» ottieni i file con i nuovi nomi numerati, in ordine. Comodo per foto, scansioni o frame da mettere in ordine prima di archiviarli o inviarli.",
"qr-generator":"Scegli il tipo di contenuto (link, testo libero, email o telefono), inserisci i dati e guarda l’anteprima dal vivo. Imposti il livello di correzione degli errori, da basso (7%) ad alto (30%), che rende il codice leggibile anche se è un po’ rovinato, e personalizzi i colori del modulo e dello sfondo. Scarichi il QR in PNG oppure in SVG, quest’ultimo ideale per stampare a qualsiasi dimensione.",
"web-overlay-cookie-cleaner":"Un preferito del browser che ripulisce le pagine. Trascini il pulsante della pagina nella barra dei Preferiti; poi, quando un sito è invaso da banner dei cookie, sovrimpressioni, pop-up, video flottanti o scroll bloccato, premi il preferito e la pagina viene liberata. Funziona su qualsiasi sito, senza installare estensioni."
};
const TX={it:{sub:"Utility web e Test App",ph:"Cerca un’app…",open:"Apri l’app",none:"Nessuna app trovata."},
en:{sub:"Web utilities & test apps",ph:"Search an app…",open:"Open app",none:"No apps found."}};
const $=s=>document.getElementById(s),norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let L=localStorage.getItem("hubLang")||"it",Q="",SEL=(location.hash||"").slice(1)||APPS[0].id,tok=0;
if(!APPS.some(a=>a.id===SEL))SEL=APPS[0].id;
const item=a=>`<li><a class="it" href="#${a.id}" data-id="${a.id}"><span>${a.ic}</span><span>${a.n}</span></a></li>`;
const sitem=a=>`<li><a class="it" style="--c:${CATS[a.cat].c}" href="#${a.id}" data-id="${a.id}"><span>${a.ic}</span><span>${a.n}<small>${CATS[a.cat][L]}</small></span></a></li>`;
function bar(){
  let h=`<div class="cat sr"><label class="search"><span aria-hidden="true">🔎</span><input id="q" type="search" autocomplete="off" placeholder="${TX[L].ph}" value="${esc(Q)}"></label><ul class="menu" id="mq"></ul></div>`;
  for(const k in CATS){const c=CATS[k];
    h+=`<div class="cat" data-k="${k}" style="--c:${c.c}"><button class="cb" type="button" aria-haspopup="true" aria-expanded="false"><span>${c[L]}</span><i class="chev"></i></button><ul class="menu">${APPS.filter(a=>a.cat===k).map(item).join("")}</ul></div>`}
  $("bar").innerHTML=h;mark();
}
function mark(){
  document.querySelectorAll(".it").forEach(x=>x.classList.toggle("sel",x.dataset.id===SEL));
  const k=APPS.find(a=>a.id===SEL).cat;
  document.querySelectorAll(".cat[data-k]").forEach(x=>x.classList.toggle("cur",x.dataset.k===k));
}
function closeAll(){document.querySelectorAll(".cat.open").forEach(c=>{c.classList.remove("open");const b=c.querySelector(".cb");if(b)b.setAttribute("aria-expanded","false")})}
function place(m){
  m.style.left="0";
  const p=m.parentElement.getBoundingClientRect(),w=m.getBoundingClientRect().width;
  m.style.left=(Math.min(Math.max(8,p.left),innerWidth-8-w)-p.left)+"px";
}
function sres(){
  const q=norm(Q),m=$("mq"),box=m.parentElement;
  closeAll();if(!q)return;
  const l=APPS.filter(a=>norm(a.n+" "+a.it+" "+a.en).includes(q));
  m.innerHTML=l.length?l.map(sitem).join(""):`<li class="none">${TX[L].none}</li>`;
  box.classList.add("open");place(m);
}
async function show(){
  const a=APPS.find(x=>x.id===SEL),t=TX[L],c=CATS[a.cat],my=++tok;
  const ext=a.u.startsWith(H)?"":' target="_blank" rel="noopener"';
  $("main").innerHTML=`<article style="--c:${c.c}">
  <div><div class="stage" id="stage"><div class="ph"><b>${a.ic}</b><span>${a.n}</span></div></div><div class="thumbs" id="th"></div></div>
  <div class="info"><span class="crumb">${c[L]}</span><h2>${a.n}</h2><span class="st" style="--s:${ST[a.st].c}">${ST[a.st][L]}</span>
  <a class="go" href="${a.u}"${ext}>${t.open}</a>
  <p class="desc">${(L==="it"&&DESC[a.id])||a[L]}</p></div></article>`;
  const urls=[a.id+".png",a.id+"-1.png",a.id+"-2.png",a.id+"-3.png"].map(f=>"screenshots/"+f);
  const ok=(await Promise.all(urls.map(u=>new Promise(r=>{const i=new Image();i.onload=()=>r(u);i.onerror=()=>r(null);i.src=u})))).filter(Boolean);
  if(my!==tok||!ok.length)return;
  const im=document.createElement("img");im.src=ok[0];im.alt=a.n;im.onclick=()=>{$("big").firstChild.src=im.src;$("big").classList.add("open")};
  $("stage").appendChild(im);
  if(ok.length>1)ok.forEach((u,i)=>{const th=new Image();th.src=u;th.alt="";if(!i)th.className="on";
    th.onclick=()=>{im.src=u;[...$("th").children].forEach(x=>x.classList.remove("on"));th.classList.add("on")};$("th").appendChild(th)});
}
function ui(){
  const t=TX[L];document.documentElement.lang=L;$("sub").textContent=t.sub;
  $("l-it").classList.toggle("on",L==="it");$("l-en").classList.toggle("on",L==="en");
  bar();show();if(Q)sres();
}
$("bar").onclick=e=>{
  const b=e.target.closest(".cb");
  if(b){const c=b.parentElement,was=c.classList.contains("open");closeAll();
    if(!was){c.classList.add("open");b.setAttribute("aria-expanded","true");place(c.querySelector(".menu"))}return}
  const a=e.target.closest(".it");
  if(a){e.preventDefault();SEL=a.dataset.id;history.replaceState(null,"","#"+SEL);Q="";$("q").value="";closeAll();mark();show();scrollTo(0,0)}
};
$("bar").addEventListener("input",e=>{if(e.target.id==="q"){Q=e.target.value;sres()}});
$("bar").addEventListener("focusin",e=>{if(e.target.id==="q"&&Q)sres()});
document.addEventListener("click",e=>{if(!e.target.closest("#bar"))closeAll()});
addEventListener("resize",closeAll);
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h!==SEL&&APPS.some(a=>a.id===h)){SEL=h;mark();show()}});
$("big").onclick=()=>$("big").classList.remove("open");
document.onkeydown=e=>{if(e.key==="Escape"){$("big").classList.remove("open");closeAll()}};
["it","en"].forEach(l=>$("l-"+l).onclick=()=>{L=l;localStorage.setItem("hubLang",l);ui()});
ui();
</script>
</body>
</html>
